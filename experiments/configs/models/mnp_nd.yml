model:
  _target_: tnp.models.tnp.TNP
  encoder: ${tnp_encoder}
  decoder: ${tnp_decoder}
  likelihood: ${likelihood}

tnp_encoder:
  _target_: tnp.models.tnp.TNPEncoder
  transformer_encoder: ${transformer_encoder}
  xy_encoder: ${xy_encoder}

transformer_encoder:
  _target_: tnp.networks.mamba.MNPNDMambaEncoder
  mamba_layer: ${mamba_layer}
  num_layers: ${params.num_layers}

mamba_layer:
  _target_: tnp.networks.mamba.MambaEncoderLayer
  embed_dim: ${params.embed_dim}  # Dimension of the input features/embeddings
  norm: True                 # Apply normalization (e.g. LayerNorm)
  residual: True             # Apply residual connection
  mamba2: False              # Use Mamba2 implementation if true
  enc_conv: False            # Enable encoding convolution
  enc_conv_kernel: 5         # Kernel size for encoding convolution
  enc_conv_dilation: 0       # Dilation rate for encoding convolution
  d_state: 128               # SSM state dimension
  block_expansion: 2         # Expansion factor (inner dim = block_expansion * embed_dim)
  d_conv: 4                  # Local convolution kernel size
  bidirectional_mamba: False  # Use bidirectional Mamba

mhca_layer:
  _target_: tnp.networks.attention_layers.MultiHeadCrossAttentionLayer
  embed_dim: ${params.embed_dim}
  num_heads: ${params.num_heads}
  head_dim: ${params.head_dim}
  feedforward_dim: ${params.embed_dim}
  norm_first: ${params.norm_first}

xy_encoder:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${eval:${params.dim_x}+${params.dim_y}+1}
  out_dim: ${params.embed_dim}
  num_layers: 2
  width: ${params.embed_dim}

tnp_decoder:
  _target_: tnp.models.tnp.TNPDecoder
  z_decoder: ${z_decoder}

z_decoder:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${params.embed_dim}
  out_dim: ${eval:'2 * ${params.dim_y}'}
  num_layers: 2
  width: ${params.embed_dim}

likelihood:
  _target_: tnp.likelihoods.gaussian.HeteroscedasticNormalLikelihood
  min_noise: 1.0e-4

optimiser:
  _target_: torch.optim.AdamW
  _partial_: True
  lr: 5.0e-4
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 0.01

scheduler:
  type: "warmup_cosine"  # Options: "constant", "warmup", "cosine", "warmup_cosine"
  warmup:
    steps: null          # Specific number of warmup steps (overrides fraction)
    fraction: 0.05       # Fraction of total training steps for warmup
  cosine:
    eta_min: 1.0e-6      # Minimum learning rate for cosine annealing
    T_max: null          # Max steps for cosine (null = auto-calculate)

params:
  epochs: 500
  embed_dim: 128
  num_heads: 8
  head_dim: 16
  norm_first: True
  num_layers: 5
  dim_x: 1
  dim_y: 1


misc:
  name: MNP-ND (target context concat)
  resume_from_checkpoint: null
  gradient_clip_val: 0.5
  plot_interval: 10
