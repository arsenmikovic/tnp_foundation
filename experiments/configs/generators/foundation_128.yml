generators:
  train:
    _target_: tnp.data.tempopfn_generator.TempoPFNGenerator
    tempo_root: /scratches/cartwright/am3078/tnp_v2/experiments/TempoPFNDatasets
    mixture_weights:
      kernel: 0.1
      forecast_pfn: 0.1
      sinewave: 0.1
      sawtooth: 0.1
      step: 0.1
      spike: 0.1
      anomaly: 0.1
      ou_process: 0.3
    length: 128
    dim: 1
    min_nc: 127
    max_nc: 127
    samples_per_epoch: 16000
    batch_size: 8
    deterministic: false
    deterministic_seed: 0

  val:
    _target_: tnp.data.tempopfn_generator.TempoPFNGenerator
    tempo_root: /scratches/cartwright/am3078/tnp_v2/experiments/TempoPFNDatasets
    mixture_weights: ${generators.train.mixture_weights}
    length: 128
    dim: 1
    min_nc: 127
    max_nc: 127
    samples_per_epoch: 4096
    batch_size: 8
    deterministic: false
    deterministic_seed: 123

  test:
    _target_: tnp.data.tempopfn_generator.TempoPFNGenerator
    tempo_root: /scratches/cartwright/am3078/tnp_v2/experiments/TempoPFNTests
    mixture_weights: ${generators.train.mixture_weights}
    length: 128
    dim: 1
    min_nc: 112
    max_nc: 112
    samples_per_epoch: 4096
    batch_size: 8
    deterministic: true
    deterministic_seed: 123

  ar_test:
    _target_: tnp.data.tempopfn_generator.TempoPFNGenerator
    tempo_root: /scratches/cartwright/am3078/tnp_v2/experiments/TempoPFNTests
    mixture_weights: ${generators.train.mixture_weights}
    length: 128
    dim: 1
    min_nc: 64
    max_nc: 64
    samples_per_epoch: 4096
    batch_size: 8
    deterministic: true
    deterministic_seed: 123


misc:
  project: foundation_128
  name: mamba_casual_temporal
